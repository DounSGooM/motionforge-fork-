<!doctype html>
<!--
  motionforge template: stat-counter — one big number that counts up, a label, a progress ring and a visible source line
  © 2026 motionforge contributors, MIT
  Honesty rule: every number needs a real source. Put it in "source"; the template shows it on screen.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #eyebrow { top: 520px; }
      #ring { position: absolute; left: 50%; top: 610px; width: 640px; height: 640px; margin-left: -320px; }
      #ring circle { fill: none; stroke-width: 26; }
      #ring .track { stroke: var(--mf-line); }
      #ring .bar { stroke: var(--mf-accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
      #number { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 800 190px/1 var(--mf-font-display); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
      #number .affix { font-size: 0.5em; letter-spacing: -0.02em; color: var(--mf-accent); }
      #label { position: absolute; left: 110px; right: 110px; top: 1320px; text-align: center; font: 700 58px/1.18 var(--mf-font-display); letter-spacing: -0.02em; }
      #source { position: absolute; left: 110px; right: 110px; top: 1500px; text-align: center; font: 500 28px/1.3 var(--mf-font-mono); color: var(--mf-muted); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <svg id="ring" class="clip" viewBox="0 0 640 640" data-start="0" data-duration="4" data-track-index="1">
        <circle class="track" cx="320" cy="320" r="290" />
        <circle class="bar" cx="320" cy="320" r="290" />
      </svg>
      <div id="number" class="clip" data-start="0" data-duration="4" data-track-index="2"><span class="affix" id="prefix"></span><span id="value">0</span><span class="affix" id="suffix"></span></div>
      <div id="label" class="clip" data-start="0" data-duration="4" data-track-index="3"></div>
      <div id="source" class="clip" data-start="0" data-duration="4" data-track-index="4"></div>
    </div>

    <script id="params" type="application/json">
{
  "value": 72,
  "from": 0,
  "decimals": 0,
  "prefix": "",
  "suffix": "%",
  "locale": "en-US",
  "label": "Replace with what the number measures",
  "eyebrow": "Example — replace",
  "source": "Source: name of the study, year (required)",
  "ringPercent": 72,
  "start": 0.2,
  "countDuration": 1.4,
  "theme": "dark",
  "lang": "en",
  "duration": 4
}
    </script>

    <script>
      const P = MF.params();
      document.documentElement.lang = P.lang;
      if (P.theme === "light") document.getElementById("root").classList.add("light");
      document.getElementById("eyebrow").textContent = P.eyebrow || "";
      document.getElementById("prefix").textContent = P.prefix || "";
      document.getElementById("suffix").textContent = P.suffix || "";
      document.getElementById("label").textContent = P.label || "";
      document.getElementById("source").textContent = P.source || "";

      const format = (v) => Number(v).toLocaleString(P.locale, { minimumFractionDigits: P.decimals, maximumFractionDigits: P.decimals });
      const value = document.getElementById("value");
      value.textContent = format(P.from);

      const circumference = 2 * Math.PI * 290;
      const bar = document.querySelector("#ring .bar");
      bar.style.strokeDasharray = circumference;
      const ringTarget = Math.max(0, Math.min(100, P.ringPercent ?? 0));
      if (!ringTarget) document.getElementById("ring").style.display = "none";

      const tl = MF.timeline("main", P.duration);
      const t0 = P.start;
      tl.fromTo("#eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, t0);
      tl.fromTo("#ring", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, t0);
      tl.fromTo("#number", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, t0 + 0.1);
      // The number is a tweened property with a formatting modifier: it re-renders correctly on any seek.
      tl.fromTo(value, { innerText: P.from }, {
        innerText: P.value,
        duration: P.countDuration,
        ease: "power2.out",
        modifiers: { innerText: (v) => format(v) },
      }, t0 + 0.1);
      tl.fromTo(bar, { strokeDashoffset: circumference }, { strokeDashoffset: circumference * (1 - ringTarget / 100), duration: P.countDuration, ease: "power2.out" }, t0 + 0.1);
      tl.fromTo("#number", { scale: 1 }, { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" }, t0 + 0.1 + P.countDuration);
      tl.fromTo("#label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t0 + 0.5);
      tl.fromTo("#source", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0 + 0.8);
      MF.ready();
      tl.seek(0);
    </script>
  </body>
</html>
