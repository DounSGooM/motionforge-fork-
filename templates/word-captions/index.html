<!doctype html>
<!--
  motionforge template: word-captions — voice-synced captions, a few words at a time, active word highlighted
  © 2026 motionforge contributors, MIT
  Feed it words.json from tools/word_timings.py ("words" = [{w, s, e}] in seconds, scene-local).
  Render it over a transparent or solid background, or copy the logic into a larger scene.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #captions { position: absolute; inset: 0; }
      .chunk { position: absolute; left: 60px; right: 60px; bottom: var(--cap-bottom, 440px); text-align: center; opacity: 0; }
      .chunk .inner { display: inline-block; padding: 14px 28px; border-radius: 24px; }
      .style-pill .chunk .inner { background: rgba(8, 9, 11, 0.74); }
      .style-outline .chunk .inner { -webkit-text-stroke: 3px rgba(0, 0, 0, 0.85); paint-order: stroke fill; }
      .cw { display: inline-block; font: 800 64px/1.15 var(--mf-font-display); letter-spacing: -0.02em; color: rgba(255, 255, 255, 0.45); margin: 0 0.14em; }
      .cw.upper { text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.6" data-width="1080" data-height="1920">
      <div id="captions" class="clip" data-start="0" data-duration="4.6" data-track-index="0"></div>
    </div>

    <script id="params" type="application/json">
{
  "words": [
    { "w": "Captions", "s": 0.20, "e": 0.62 },
    { "w": "follow", "s": 0.66, "e": 0.98 },
    { "w": "the", "s": 1.00, "e": 1.10 },
    { "w": "voice,", "s": 1.12, "e": 1.55 },
    { "w": "one", "s": 2.05, "e": 2.25 },
    { "w": "word", "s": 2.28, "e": 2.55 },
    { "w": "at", "s": 2.58, "e": 2.68 },
    { "w": "a", "s": 2.70, "e": 2.76 },
    { "w": "time.", "s": 2.80, "e": 3.30 }
  ],
  "maxWords": 4,
  "pauseSplit": 0.35,
  "hold": 0.6,
  "bottom": 1480,
  "fontSize": 64,
  "style": "pill",
  "uppercase": false,
  "lang": "en",
  "transparent": false,
  "duration": 4.6
}
    </script>

    <script>
      const P = MF.params();
      document.documentElement.lang = P.lang;
      const root = document.getElementById("root");
      if (P.transparent) {
        root.classList.remove("mf-stage");
        document.documentElement.style.background = document.body.style.background = "transparent";
      }
      const box = document.getElementById("captions");
      box.classList.add("style-" + P.style);
      // "bottom" is the y of the caption baseline area in the 1080x1920 frame; the box is full-frame so render engines that clip timed elements to their box keep it visible.
      box.style.setProperty("--cap-bottom", 1920 - P.bottom + "px");

      // Chunks: at most maxWords, and a new chunk after a pause or a sentence end.
      const chunks = [];
      let current = null;
      P.words.forEach((word, i) => {
        const prev = P.words[i - 1];
        const pause = prev ? word.s - prev.e : 0;
        const sentenceEnd = prev && /[.!?…]$/.test(prev.w);
        if (!current || current.words.length >= P.maxWords || pause > P.pauseSplit || sentenceEnd) {
          current = { words: [] };
          chunks.push(current);
        }
        current.words.push(word);
      });
      chunks.forEach((c, i) => {
        c.s = c.words[0].s;
        const end = c.words[c.words.length - 1].e + P.hold;
        c.e = Math.min(end, chunks[i + 1] ? chunks[i + 1].words[0].s : end);
      });

      const tl = MF.timeline("main", P.duration);
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--mf-accent").trim();
      chunks.forEach((c, ci) => {
        const el = document.createElement("div");
        el.className = "chunk";
        const inner = document.createElement("span");
        inner.className = "inner";
        el.appendChild(inner);
        const spans = c.words.map((word) => {
          const s = document.createElement("span");
          s.className = "cw" + (P.uppercase ? " upper" : "");
          s.style.fontSize = P.fontSize + "px";
          s.textContent = word.w.replace(/["“”]/g, "");
          inner.appendChild(s);
          return s;
        });
        box.appendChild(el);

        tl.fromTo(el, { opacity: 0, scale: 0.9, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.14, ease: "back.out(2)" }, c.s);
        tl.to(el, { opacity: 0, duration: 0.08 }, Math.max(c.s + 0.15, c.e - 0.08));
        c.words.forEach((word, wi) => {
          tl.set(spans[wi], { color: accent }, word.s);               // being spoken
          const next = c.words[wi + 1];
          tl.set(spans[wi], { color: "#ffffff" }, next ? next.s : c.e); // already spoken
        });
      });
      MF.ready();
      tl.seek(0);
    </script>
  </body>
</html>
