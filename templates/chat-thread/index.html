<!doctype html>
<!--
  motionforge template: chat-thread — a messaging conversation that builds message by message,
  with a typing indicator before each incoming message; older messages scroll up naturally
  © 2026 motionforge contributors, MIT
  Generic messenger look on purpose: do not imitate a specific app's trademarked interface.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #chat { position: absolute; left: 70px; right: 70px; top: 420px; height: 1080px; border-radius: 48px; overflow: hidden; background: #111317;
        border: 2px solid var(--mf-line); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5); }
      #head { position: absolute; top: 0; left: 0; right: 0; height: 130px; display: flex; align-items: center; gap: 22px; padding: 0 36px; background: #181b21; border-bottom: 2px solid #22262e; z-index: 2; }
      #avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--mf-accent); color: var(--mf-accent-ink); display: flex; align-items: center; justify-content: center; font: 800 34px var(--mf-font-display); }
      #name { font: 700 38px var(--mf-font-display); color: #fff; }
      #sub { font: 500 24px var(--mf-font-body); color: var(--mf-muted); }
      #thread { position: absolute; left: 0; right: 0; top: 130px; bottom: 0; padding: 0 30px 34px; display: flex; flex-direction: column; justify-content: flex-end; }
      .row { display: grid; grid-template-rows: 0fr; }
      .row > .clipbox { overflow: hidden; min-height: 0; display: flex; }
      .row.me > .clipbox { justify-content: flex-end; }
      .bubble { max-width: 78%; margin-top: 18px; padding: 22px 30px; border-radius: 36px; font: 500 38px/1.3 var(--mf-font-body); }
      .them .bubble { background: #262a33; color: #fff; border-bottom-left-radius: 10px; }
      .me .bubble { background: var(--mf-accent); color: var(--mf-accent-ink); border-bottom-right-radius: 10px; }
      .typing .bubble { display: flex; gap: 10px; padding: 28px 30px; }
      .typing i { width: 14px; height: 14px; border-radius: 50%; background: #9aa0aa; display: block; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <div id="chat" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div id="head"><div id="avatar"></div><div><div id="name"></div><div id="sub"></div></div></div>
        <div id="thread"></div>
      </div>
    </div>

    <script id="params" type="application/json">
{
  "contact": "Sam",
  "status": "online",
  "messages": [
    { "from": "them", "text": "Did the video go out?", "at": 0.9 },
    { "from": "me", "text": "Rendering now. Checks passed.", "at": 2.2 },
    { "from": "them", "text": "Captions too?", "at": 3.6 },
    { "from": "me", "text": "Synced to every word.", "at": 4.8 }
  ],
  "typing": 0.8,
  "lang": "en",
  "duration": 7
}
    </script>

    <script>
      const P = MF.params();
      document.documentElement.lang = P.lang;
      document.getElementById("name").textContent = P.contact;
      document.getElementById("sub").textContent = P.status || "";
      document.getElementById("avatar").textContent = (P.contact || "?").trim().charAt(0).toLocaleUpperCase(P.lang);

      const thread = document.getElementById("thread");
      const makeRow = (cls, inner) => {
        const row = document.createElement("div");
        row.className = "row " + cls;
        row.innerHTML = '<div class="clipbox"><div class="bubble"></div></div>';
        if (typeof inner === "string") row.querySelector(".bubble").textContent = inner;
        else row.querySelector(".bubble").append(...inner);
        thread.appendChild(row);
        return row;
      };

      const tl = MF.timeline("main", P.duration);
      tl.fromTo("#chat", { opacity: 0, y: 120, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.1);

      // Rows grow from 0fr to 1fr: the layout (and the scroll of older messages) follows the real text height.
      P.messages.forEach((m) => {
        if (m.from !== "me" && P.typing > 0) {
          const dots = [0, 1, 2].map(() => document.createElement("i"));
          const typing = makeRow("them typing", dots);
          const t0 = Math.max(0.5, m.at - P.typing);
          tl.fromTo(typing, { gridTemplateRows: "0fr", opacity: 0 }, { gridTemplateRows: "1fr", opacity: 1, duration: 0.2, ease: "power2.out" }, t0);
          dots.forEach((d, i) => tl.fromTo(d, { y: 0 }, { y: -8, duration: 0.18, yoyo: true, repeat: Math.max(1, Math.floor(P.typing / 0.36) * 2 - 1), ease: "sine.inOut" }, t0 + i * 0.1));
          tl.to(typing, { gridTemplateRows: "0fr", opacity: 0, duration: 0.15, ease: "power2.in" }, m.at - 0.12);
        }
        const row = makeRow(m.from === "me" ? "me" : "them", m.text);
        const bubble = row.querySelector(".bubble");
        tl.fromTo(row, { gridTemplateRows: "0fr" }, { gridTemplateRows: "1fr", duration: 0.28, ease: "power3.out" }, m.at);
        tl.fromTo(bubble, { opacity: 0, scale: 0.6, transformOrigin: m.from === "me" ? "100% 100%" : "0% 100%" },
          { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, m.at);
      });
      MF.ready();
      tl.seek(0);
    </script>
  </body>
</html>
