      .row:last-child { border-bottom: none; }

      .row svg path, .row svg rect, .row svg circle { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

      #ticker { position: absolute; left: 60px; top: 1632px; display: flex; gap: 12px; align-items: center; z-index: 5; }
      #ticker i { display: block; width: 12px; height: 12px; border-radius: 6px; background: var(--sup); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
      #room { position: absolute; left: 330px; top: 1622px; font: 700 28px/1 "Plus Jakarta Sans", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45); z-index: 5; }
      #note { position: absolute; left: 60px; top: 1690px; font: 600 22px/1 "Plus Jakarta Sans", sans-serif; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); z-index: 5; opacity: .9; }
    </style>

          <rect x="60" y="990" width="1060" height="330" fill="#fbfaf7" stroke="#e1dbd0" stroke-width="4"/><path d="M325 990 V1320 M590 990 V1320 M855 990 V1320" stroke="#e1dbd0" stroke-width="4"/>

                    <path d="M520 1360 c 0 -60 30 -80 50 -80 c 20 0 50 20 50 80Z" fill="#efe9de"/><path d="M570 1290 C 540 1240 520 1220 500 1210 C 540 1214 560 1240 570 1290 C 580 1240 600 1220 630 1210 C 610 1236 590 1256 570 1290Z" fill="#5d8a55"/>

    <script>
      const DUR = 4.5, CUT = 2.9;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      // footage: slow pan (7 % of width) on the living room, hard cut to the kitchen with a 1.00 -> 1.08 push
      tl.fromTo("#s1 svg", { x: 0, scale: 1.02 }, { x: -82, scale: 1.04, duration: CUT, ease: "power1.inOut" }, 0);
      tl.set("#s2", { opacity: 0 }, 0); tl.set("#s2", { opacity: 1 }, CUT); tl.set("#s1", { opacity: 0 }, CUT);
      tl.fromTo("#s2 svg", { x: -50, scale: 1.0, transformOrigin: "50% 50%" }, { x: -50, scale: 1.08, duration: DUR - CUT, ease: "power1.inOut" }, CUT);
      tl.fromTo(["#eyebrow", "#addr"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.08 }, 0.1);
      // price chip: appears whole, 0.2 s fade with a 1.04 -> 1 settle
      tl.fromTo("#price", { opacity: 0, scale: 1.04, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 0.8);
      // fact card: rises 80 px with fade, rows stagger 0.08 s, icons draw 0.3 s, counts run 0.5 s
      tl.fromTo("#card", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.35);
      tl.fromTo(".row", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 1.5);
      document.querySelectorAll(".row svg *").forEach((p) => { const L = p.getTotalLength ? p.getTotalLength() : 200; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
      tl.to(".row svg *", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 1.55);
      document.querySelectorAll(".row b").forEach((b, i) => { const o = { v: 0 }, n = +b.dataset.n; tl.to(o, { v: n, duration: 0.5, ease: "power2.out", onUpdate: () => { b.textContent = Math.round(o.v); } }, 1.55 + i * 0.08); });
      // room ticker: active dot widens 12 -> 36 px and fills teal as the room name swaps
      const dots = gsap.utils.toArray("#ticker i");
      tl.fromTo("#ticker, #room, #note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
      tl.fromTo(dots[0], { width: 12, backgroundColor: "#E6E1D8" }, { width: 36, backgroundColor: "#0E7C74", duration: 0.3 }, 0.5);
      tl.to(dots[0], { width: 12, backgroundColor: "#E6E1D8", duration: 0.3 }, CUT);
      tl.fromTo(dots[1], { width: 12, backgroundColor: "#E6E1D8" }, { width: 36, backgroundColor: "#0E7C74", duration: 0.3 }, CUT);
      const room = document.getElementById("room");
      tl.call(() => { room.textContent = "Living room"; }, null, 0.01);
      tl.call(() => { room.textContent = "Kitchen"; }, null, CUT);
      tl.seek(0);
    </script>
