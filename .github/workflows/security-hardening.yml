name: Security hardening checks

on:
  push:
    branches: [security-hardening]
  pull_request:
    paths:
      - "engines/**"
      - "tools/avatar/**"
      - "tests/test_security_hardening.py"
      - ".github/workflows/security-hardening.yml"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          bash -n engines/hyperframes/scripts/new-scene.sh
          node --check engines/canvas/render.mjs
          python -m py_compile tools/avatar/avatar.py
      - name: Security regressions
        run: python -m unittest discover -s tests -p 'test_security_hardening.py' -v
