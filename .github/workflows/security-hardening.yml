name: Security hardening checks

on:
  push:
    branches: [security-hardening]
  pull_request:
    paths:
      - "engines/**"
      - "tools/avatar/**"
      - "tests/**"
      - "security/**"
      - ".github/workflows/security-hardening.yml"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          bash -n engines/hyperframes/scripts/new-scene.sh
          node --check engines/canvas/render.mjs
          node --check tests/test_browser_security.mjs
          node --check tests/test_render_smoke.mjs
          node --check tests/test_multiscene.mjs
          python -m py_compile tools/avatar/avatar.py
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_security_hardening.py' -v
      - name: Install isolated Chromium test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Dynamic browser and HTTP security tests
        run: node --test tests/test_browser_security.mjs
      - name: End-to-end animation and MP4 encoding smoke test
        run: |
          ffmpeg -version | head -n 1
          node --test tests/test_render_smoke.mjs tests/test_multiscene.mjs

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate committed dependency lockfile and audit exact graph
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --audit-level=high
          node - <<'NODE'
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          assert.equal(lock.lockfileVersion,3);
          assert.deepEqual(lock.packages[""].devDependencies,pkg.devDependencies);
          assert.equal(lock.packages["node_modules/undici"].version,"7.30.2");
          for(const [name,version] of Object.entries(pkg.devDependencies)) {
            assert.match(version,/^\\d+\\.\\d+\\.\\d+$/);
            assert.equal(lock.packages["node_modules/"+name].version,version);
          }
          console.log("Verified pinned top-level versions, integrity-backed lockfile and patched undici");
          NODE
      - name: Python dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r security/python-audit-requirements.txt

  macos-smoke:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record macOS CPU architecture and tools
        run: |
          sw_vers
          uname -m
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Install isolated render dependencies
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npx playwright install chromium
      - name: Run real macOS single and multi-scene video tests
        run: node --test tests/test_render_smoke.mjs tests/test_multiscene.mjs
